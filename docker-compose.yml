services:
  # Servidor Web ERP (PHP 8.2 + Apache + Driver PostgreSQL)
  web:
    container_name: panyqueque_erp_web
    build:
      context: .
      dockerfile: Dockerfile
    image: panyqueque-erp:1.0.0
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Montaje en caliente para desarrollo en vivo
      - .:/var/www/html
      # Configuración de Apache personalizada (DocumentRoot en /public)
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - TZ=America/Santiago
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=panyqueque_erp
      - DB_USER=erp_user
      - DB_PASS=erp_password_2026
    depends_on:
      - db
    networks:
      - panyqueque_net

  # Base de Datos Central (PostgreSQL 15)
  db:
    container_name: panyqueque_erp_db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=panyqueque_erp
      - POSTGRES_USER=erp_user
      - POSTGRES_PASSWORD=erp_password_2026
      - TZ=America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - panyqueque_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - panyqueque_net

networks:
  panyqueque_net:
    driver: bridge
    name: panyqueque_network

volumes:
  panyqueque_pg_data:
    name: panyqueque_pg_data
