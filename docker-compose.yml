services:
  # ERP Web Server (PHP 8.2 + Apache + PostgreSQL Driver)
  web:
    container_name: panyqueque_erp_web
    build:
      context: .
      dockerfile: Dockerfile
    image: panyqueque-erp:1.0.0
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Hot-reload mount for live development
      - .:/var/www/html
      # Custom Apache configuration (DocumentRoot at /public)
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    env_file:
      - .env
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    depends_on:
      - db
    networks:
      - panyqueque_net

  # Central Database (PostgreSQL 15)
  db:
    container_name: panyqueque_erp_db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - TZ=${TZ:-America/Santiago}
    ports:
      - "5432:5432"
    volumes:
      - panyqueque_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - panyqueque_net

networks:
  panyqueque_net:
    driver: bridge
    name: panyqueque_network

volumes:
  panyqueque_pg_data:
    name: panyqueque_pg_data
