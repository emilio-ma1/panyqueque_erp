<VirtualHost *:80>
    ServerName localhost
    ServerAdmin soporte@panyqueque.cl
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Alias /public para permitir tanto http://localhost:8080/ como http://localhost:8080/public/
    Alias /public /var/www/html/public

    # Proteger archivos sensibles y de configuración
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/panyqueque_error.log
    CustomLog ${APACHE_LOG_DIR}/panyqueque_access.log combined
</VirtualHost>
